[project]
name = "claw_engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claw_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
